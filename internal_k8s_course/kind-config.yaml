# kind-config.yaml
# Defines a Kind cluster with 1 control-plane and 2 worker nodes.
# This mimics a real multi-node cluster on your local machine.
kind: Cluster
apiVersion: kind.x-k8s.io/v1alpha4
nodes:
  - role: control-plane
    kubeadmConfigPatches:
      - |
        kind: InitConfiguration
        nodeRegistration:
          kubeletExtraArgs:
            # Label this node so the NGINX Ingress Controller knows
            # to bind to it (used in Module 2)
            node-labels: "ingress-ready=true"
    extraPortMappings:
      # Map container ports to host ports so we can access
      # services via localhost on our Mac
      - containerPort: 80    # HTTP traffic
        hostPort: 80
        protocol: TCP
      - containerPort: 443   # HTTPS traffic
        hostPort: 443
        protocol: TCP
  - role: worker     # First worker node
  - role: worker     # Second worker node
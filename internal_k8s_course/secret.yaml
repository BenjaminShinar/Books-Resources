# secret.yaml
# Secrets work like ConfigMaps but for sensitive data.
# "stringData" accepts plain text (K8s base64-encodes it internally).
# In production, use external secret managers (Vault, AWS Secrets Manager).
apiVersion: v1
kind: Secret
metadata:
  name: app-secret
type: Opaque                # Generic secret type
stringData:
  DB_PASSWORD: "s3cret-pass"
  API_KEY: "abc123def456"
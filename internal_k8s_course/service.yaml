# service.yaml
# A ClusterIP Service that routes traffic to pods matching the selector.
# Other pods in the cluster can reach this service at nginx-svc:80
apiVersion: v1
kind: Service
metadata:
  name: nginx-svc
spec:
  type: ClusterIP         # Only accessible within the cluster
  selector:
    app: nginx            # Routes to pods with label app=nginx
  ports:
    - port: 80            # Port the Service listens on
      targetPort: 80      # Port on the pod to forward to